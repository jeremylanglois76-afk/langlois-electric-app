workflows:
  ios-testflight:
    name: Langlois Electric - iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.langloiselectric.crew

    scripts:
      - name: Create iOS app wrapper
        script: |
          set -e
          rm -rf ios www package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

          npx cap init "Langlois Electric Crew" "com.langloiselectric.crew" --web-dir www
          npx cap add ios
          npx cap sync ios

          cp "App Logo.png" ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Install iOS dependencies
        script: |
          set -e
          cd ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

  android-test:
    name: Langlois Electric - Android Test Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Create Android app wrapper
        script: |
          set -e
          rm -rf android www package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          npx cap init "Langlois Electric Crew" "com.langloiselectric.crew" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android test APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
